name: Build iOS IPA for SideStore

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Next.js Static Export
        run: npm run build

      - name: Add & Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Inject Meraki Official App Icon
        run: |
          if [ -d "ios/App/App/Assets.xcassets/AppIcon.appiconset" ]; then
            for icon in ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png; do
              if [ -f "$icon" ]; then
                cp public/favicon.png "$icon"
              fi
            done
            cp public/favicon.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png || true
            cp public/favicon.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon.png || true
          fi

      - name: Build Xcode Project (Ad-Hoc / Unsigned for SideStore)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=YES \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     ENABLE_USER_SCRIPT_SANDBOXING=NO \
                     COMPILER_INDEX_STORE_ENABLE=NO \
                     clean build

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build
          zip -qr Meraki-SideStore.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meraki-SideStore-IPA
          path: build/Meraki-SideStore.ipa
          retention-days: 30
