name: Build iOS IPA (Sideload)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build & Package Meraki.ipa
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Next.js Static Web Application
        run: npm run build

      - name: Sync Capacitor iOS Platform
        run: npx cap sync ios

      - name: Install CocoaPods Dependencies
        run: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Build iOS App with Xcode (Unsigned for Sideloading)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build

      - name: Package .app into Meraki.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::App bundle not found in build output!"
            exit 1
          fi
          echo "Found application bundle: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -qr Meraki.ipa Payload
          rm -rf Payload
          echo "Meraki.ipa created successfully:"
          ls -lh Meraki.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meraki-iOS-IPA
          path: Meraki.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release (Optional on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Meraki.ipa
          generate_release_notes: true
